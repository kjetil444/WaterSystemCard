      - action: input_number.set_value
        target: {entity_id: input_number.water_max_run_minutes}
        data: {value: 20}
      - action: input_number.set_value
        target: {entity_id: input_number.water_short_cycle_seconds}
        data: {value: 30}
      - action: input_number.set_value
        target: {entity_id: input_number.water_min_temp}
        data: {value: 3}
      - action: input_number.set_value
        target: {entity_id: input_number.water_guard_warn_temp}
        data: {value: 5}
      - action: input_number.set_value
        target: {entity_id: input_number.water_trace_warn_temp}
        data: {value: 5}
      - action: input_number.set_value
        target: {entity_id: input_number.water_trace_auto_on_temp}
        data: {value: 3}
      - action: input_number.set_value
        target: {entity_id: input_number.water_night_start}
        data: {value: 1}
      - action: input_number.set_value
        target: {entity_id: input_number.water_night_end}
        data: {value: 5}
      - action: input_number.set_value
        target: {entity_id: input_number.water_night_starts_warn}
        data: {value: 4}
      - action: input_number.set_value
        target: {entity_id: input_number.water_hot_low_temp}
        data: {value: 50}
      - action: input_number.set_value
        target: {entity_id: input_number.water_legionella_temp}
        data: {value: 70}
      - action: input_number.set_value
        target: {entity_id: input_number.water_legionella_days}
        data: {value: 7}
      - action: input_number.set_value
        target: {entity_id: input_number.water_drawdown_min}
        data: {value: 0}
      - action: input_number.set_value
        target: {entity_id: input_number.water_precharge_interval_days}
        data: {value: 182}
      - action: input_number.set_value
        target: {entity_id: input_number.water_sample_interval_days}
        data: {value: 365}
      - action: input_number.set_value
        target: {entity_id: input_number.water_uv_interval_days}
        data: {value: 365}
      - action: input_number.set_value
        target: {entity_id: input_number.water_filter_interval_days}
        data: {value: 180}
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.water_notifications
            - input_boolean.water_initialized
  # ---- push notifications for every alarm, with action buttons ----
  - id: water_alarm_notify
    alias: Water – alarm notification
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_leak
        to: "on"
        id: leak
      - trigger: state
        entity_id: binary_sensor.water_away_alarm
        to: "on"
        id: away
      - trigger: state
        entity_id: binary_sensor.water_pump_tripped
        to: "on"
        id: tripped
      - trigger: state
        entity_id: binary_sensor.water_pump_long_run
        to: "on"
        id: long_run
      - trigger: state
        entity_id: binary_sensor.water_frost_risk
        to: "on"
        id: frost
      - trigger: state
        entity_id: binary_sensor.water_frost_guard_off
        to: "on"
        id: guard_off
      - trigger: state
        entity_id: binary_sensor.water_heat_cable_off
        to: "on"
        for: {minutes: 10}
        id: trace_off
      - trigger: state
        entity_id: binary_sensor.water_low_pressure
        to: "on"
        for: {minutes: 2}
        id: low_pressure
      - trigger: state
        entity_id: binary_sensor.water_pump_short_cycling
        to: "on"
        id: short_cycle
      - trigger: state
        entity_id: binary_sensor.water_night_activity
        to: "on"
        id: night
      - trigger: state
        entity_id: binary_sensor.water_hot_water_low
        to: "on"
        for: {minutes: 30}
        id: hot_low
      - trigger: state
        entity_id: binary_sensor.water_legionella_risk
        to: "on"
        id: legionella
      - trigger: state
        entity_id: binary_sensor.water_outdoor_tap_frost
        to: "on"
        id: tap_frost
      - trigger: state
        entity_id: binary_sensor.water_irrigation_frost
        to: "on"
        id: irr_frost
      - trigger: template
        value_template: >
          {{ is_state('binary_sensor.water_irrigation_running', 'on') and
             states(state_attr('sensor.water_system_config', 'outdoor_temp')) | float(99) < 1 }}
        id: irr_run_frost
      - trigger: state
        entity_id: binary_sensor.water_irrigation_long_run
        to: "on"
        id: irr_long
      - trigger: state
        entity_id: binary_sensor.water_tank_precharge_low
        to: "on"
        id: precharge
      - trigger: state
        entity_id: binary_sensor.water_pump_wear_trend
        to: "on"
        for: {hours: 12}
        id: wear
    variables:
      msgs:
        leak: ["💧 Vannlekkasje", "Lekkasje: {{ state_attr('binary_sensor.water_leak', 'active') }}. Steng hovedkranen?", true, [{"action": "WATER_CLOSE_VALVE", "title": "Steng hovedkran"}]]
        away: ["🏠 Vann brukt mens dere er borte", "Pumpa går eller det renner vann mens bortemodus er på.", true, [{"action": "WATER_CLOSE_VALVE", "title": "Steng hovedkran"}]]
        tripped: ["⚠️ Pumpe stoppet", "Lavt trykk og pumpa går ikke. Sjekk pumpevakten (EIL = tørrkjøring).", true, []]
        long_run: ["⏱️ Pumpa går og går", "Pumpa har gått lenge uten stopp – mulig lekkasje eller lite vann i brønnen.", true, [{"action": "WATER_CLOSE_VALVE", "title": "Steng hovedkran"}]]
        frost: ["❄️ Frostfare i tankkassen", "Tankkassen er {{ states(state_attr('sensor.water_system_config', 'tank_temp')) }} °C.", true, [{"action": "WATER_FROST_GUARD_ON", "title": "Slå på frostvakt"}, {"action": "WATER_HEAT_CABLE_ON", "title": "Slå på varmekabel"}]]
        guard_off: ["❄️ Frostvakten er av", "Tankkassen er {{ states(state_attr('sensor.water_system_config', 'tank_temp')) }} °C og frostvakten er av.", false, [{"action": "WATER_FROST_GUARD_ON", "title": "Slå på frostvakt"}]]
        trace_off: ["❄️ Varmekabelen er av", "Det er {{ states(state_attr('sensor.water_system_config', 'outdoor_temp')) }} °C ute og varmekabelen er av.", false, [{"action": "WATER_HEAT_CABLE_ON", "title": "Slå på varmekabel"}]]
        low_pressure: ["Lavt vanntrykk", "Trykket er {{ states(state_attr('sensor.water_system_config', 'pressure')) }} bar.", false, []]
        short_cycle: ["Pumpa starter ofte", "Korte pumpesykluser – sjekk fortrykket i trykktanken.", false, []]
        night: ["🌙 Pumpestarter i natt", "Pumpa startet {{ states('sensor.water_pump_starts_night') }} ganger i natt – sjekk toaletter og kraner.", false, []]
        hot_low: ["Lite varmtvann", "Varmtvannet er {{ states(state_attr('sensor.water_system_config', 'hot_water_temp')) }} °C.", false, [{"action": "WATER_HEATER_ON", "title": "Slå på bereder"}]]
        legionella: ["🦠 Legionella", "Varmtvannet har ikke vært over {{ states('input_number.water_legionella_temp') | int }} °C på {{ states('input_number.water_legionella_days') | int }} dager.", false, []]
        tap_frost: ["❄️ Utekranen", "Det er {{ states(state_attr('sensor.water_system_config', 'outdoor_temp')) }} °C ute og utekranen er ikke stengt – fare for frostsprengning.", true, [{"action": "WATER_TAP_CLOSE", "title": "Steng utekran"}]]
        irr_frost: ["❄️ Hagevanning", "Det er {{ states(state_attr('sensor.water_system_config', 'outdoor_temp')) }} °C ute og hagevanningen er ikke vinterklargjort – tøm rørene før frosten.", false, [{"action": "WATER_IRR_CLOSE", "title": "Steng tilførsel"}]]
        irr_run_frost: ["❄️ Hagevanning går i frost", "Hagevanningen går mens det er {{ states(state_attr('sensor.water_system_config', 'outdoor_temp')) }} °C ute.", true, [{"action": "WATER_IRR_STOP", "title": "Stopp hagevanning"}]]
        irr_long: ["⏱️ Hagevanning", "Hagevanningen har gått lenge – sjekk om en ventil henger eller et rør er ødelagt.", true, [{"action": "WATER_IRR_STOP", "title": "Stopp hagevanning"}]]
        precharge: ["Trykktanken", "Tanken gir bare {{ states('sensor.water_tank_drawdown_avg') }} L per syklus – sjekk fortrykket.", false, []]
        wear: ["Pumpe-slitasje?", "Pumpesyklusene er lengre / strømtrekket høyere enn 30-dagerssnittet.", false, []]
      m: "{{ msgs[trigger.id] }}"
    actions:
      - action: script.water_notify
        data:
          title: "{{ m[0] }}"
          message: "{{ m[1] }}"
          critical: "{{ m[2] }}"
          actions: "{{ m[3] }}"
          tag: "water_{{ trigger.id }}"

  # ---- handle the buttons in the notifications ----
  - id: water_notification_actions
    alias: Water – notification actions
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_CLOSE_VALVE}
        id: close
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_HEAT_CABLE_ON}
        id: trace
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_FROST_GUARD_ON}
        id: guard
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_HEATER_ON}
        id: heater
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_TAP_CLOSE}
        id: tap
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_IRR_CLOSE}
        id: irr_close
      - trigger: event
        event_type: mobile_app_notification_action
        event_data: {action: WATER_IRR_STOP}
        id: irr_stop
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'close' }}"
            sequence:
              - action: script.water_close_valve
          - conditions: "{{ trigger.id == 'tap' }}"
            sequence:
              - variables:
                  t: >
                    {% set c = states.sensor.water_system_config.attributes %}
                    {{ c.get('outdoor_tap_shutoff', '') or c.get('outdoor_tap', '') }}
              - condition: template
                value_template: "{{ t not in [none, ''] }}"
              - action: "{{ 'valve.close_valve' if t.startswith('valve.') else 'homeassistant.turn_off' }}"
                target:
                  entity_id: "{{ t }}"
          - conditions: "{{ trigger.id in ['irr_close', 'irr_stop'] }}"
            sequence:
              - variables:
                  targets: >
                    {% set c = states.sensor.water_system_config.attributes %}
                    {% if trigger.id == 'irr_close' and c.get('irrigation_shutoff', '') != '' %}{{ [c.irrigation_shutoff] }}
                    {% else %}{{ c.get('irrigation', '').split(',') | map('trim') | select('ne', '') | list }}{% endif %}
              - repeat:
                  for_each: "{{ targets }}"
                  sequence:
                    - action: "{{ 'valve.close_valve' if repeat.item.startswith('valve.') else 'homeassistant.turn_off' }}"
                      target:
                        entity_id: "{{ repeat.item }}"
          - conditions: "{{ trigger.id in ['trace', 'guard', 'heater'] }}"
            sequence:
              - variables:
                  key: "{{ {'trace': 'heat_trace', 'guard': 'frost_guard', 'heater': 'water_heater'}[trigger.id] }}"
                  ent: "{{ state_attr('sensor.water_system_config', key) }}"
              - condition: template
                value_template: "{{ ent not in [none, ''] }}"
              - action: "{{ ent.split('.')[0] ~ '.turn_on' if ent.split('.')[0] in ['water_heater', 'climate'] else 'homeassistant.turn_on' }}"
                target:
                  entity_id: "{{ ent }}"

  # ---- away mode: close / open the main valve (optional) ----
  - id: water_away_valve
    alias: Water – away mode valve
    triggers:
      - trigger: state
        entity_id: input_boolean.water_away
    conditions:
      - condition: state
        entity_id: input_boolean.water_away_close_valve
        state: "on"
    actions:
      - if: "{{ trigger.to_state.state == 'on' }}"
        then:
          - action: script.water_close_valve
        else:
          - action: script.water_open_valve

  # ---- automatic heat cable (optional, input_boolean.water_auto_heat_cable) ----
  - id: water_auto_heat_cable
    alias: Water – automatic heat cable
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_boolean.water_auto_heat_cable
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.water_auto_heat_cable
        state: "on"
      - "{{ state_attr('sensor.water_system_config', 'heat_trace') not in [none, ''] }}"
      - "{{ states(state_attr('sensor.water_system_config', 'outdoor_temp')) | is_number }}"
    actions:
      - variables:
          ht: "{{ state_attr('sensor.water_system_config', 'heat_trace') }}"
          t: "{{ states(state_attr('sensor.water_system_config', 'outdoor_temp')) | float }}"
          on_below: "{{ states('input_number.water_trace_auto_on_temp') | float(3) }}"
      - choose:
          - conditions: "{{ t < on_below and is_state(ht, 'off') }}"
            sequence:
              - action: homeassistant.turn_on
                target: {entity_id: "{{ ht }}"}
          - conditions: "{{ t > on_below + 2 and is_state(ht, 'on') }}"     # 2 °C hysteresis
            sequence:
              - action: homeassistant.turn_off
                target: {entity_id: "{{ ht }}"}

  # ---- maintenance reminder, once a day ----
  - id: water_maintenance_reminder
    alias: Water – maintenance reminder
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.water_maintenance_due
        state: "on"
      - "{{ now().weekday() == 5 }}"     # Saturdays only
    actions:
      - action: script.water_notify
        data:
          title: "🔧 Vedlikehold vannanlegg"
          message: "Forfalt: {{ state_attr('binary_sensor.water_maintenance_due', 'items') | join(', ') }}"
          tag: water_maintenance
