# =====================================================================================
#  Water system package for Home Assistant  –  companion to water-system-card (v1.5)
#
#  Moves all alarm logic into HA so it works 24/7 (also when no dashboard is open):
#  alarms, pump statistics, tank pre-charge health, pump wear trend, legionella,
#  away mode, actionable push notifications, automatic heat cable and maintenance.
#
#  INSTALL
#   1. configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to /config/packages/water_system.yaml
#   3. Edit the entity IDs in "Water system config" below (leave '' for things you don't have)
#   4. Edit the notify service in script.water_notify (search for CHANGE ME)
#   5. Restart Home Assistant. Default thresholds are set once on first start; change them
#      later under Settings → Helpers (turn off 'Water package initialized' to reset).
#   6. In the card:  use_package: true
#
#  UNITS: the package compares raw sensor values, so set the helper thresholds in the same
#  units your sensors report (e.g. psi and °F). Pressure/temperature helpers are labelled bar/°C
#  below – change unit_of_measurement and min/max if your sensors use other units.
#  (The card itself converts everything – see pressure_unit, temperature_unit … in the card.)
#
#  Requires Home Assistant 2024.10 or newer.
# =====================================================================================

# -------------------------------------------------------------------------------------
# Thresholds and options (editable in the UI under Settings → Devices & services → Helpers)
# -------------------------------------------------------------------------------------
input_number:
  water_cut_in:
    name: Water cut-in pressure
    min: 0.5
    max: 8
    step: 0.1
    unit_of_measurement: bar
    icon: mdi:gauge-low
  water_cut_out:
    name: Water cut-out pressure
    min: 0.5
    max: 10
    step: 0.1
    unit_of_measurement: bar
    icon: mdi:gauge-full
  water_pump_power_threshold:
    name: Water pump running above
    min: 5
    max: 3000
    step: 5
    unit_of_measurement: W
    icon: mdi:flash
  water_pump_current_threshold:
    name: Water pump running above (current)
    min: 0.1
    max: 20
    step: 0.1
    unit_of_measurement: A
    icon: mdi:current-ac
  water_guard_delay:
    name: Water pump-stopped alarm delay
    min: 10
    max: 900
    step: 10
    unit_of_measurement: s
    icon: mdi:timer-sand
  water_max_run_minutes:
    name: Water max pump run time
    min: 1
    max: 240
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-alert
  water_short_cycle_seconds:
    name: Water short cycle below
    min: 5
    max: 300
    step: 5
    unit_of_measurement: s
    icon: mdi:sync-alert
  water_min_temp:
    name: Water frost alarm (tank box) below
    min: -10
    max: 15
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake-alert
  water_guard_warn_temp:
    name: Water frost guard off warning below
    min: -10
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:radiator-off
  water_trace_warn_temp:
    name: Water heat cable warning (outdoor) below
    min: -25
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake-thermometer
  water_trace_auto_on_temp:
    name: Water heat cable auto on below
    min: -25
    max: 15
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:heating-coil
  water_night_start:
    name: Water night window start
    min: 0
    max: 23
    step: 1
    unit_of_measurement: h
  water_night_end:
    name: Water night window end
    min: 1
    max: 23
    step: 1
    unit_of_measurement: h
  water_night_starts_warn:
    name: Water night starts warning at
    min: 1
    max: 20
    step: 1
    icon: mdi:weather-night
  water_hot_low_temp:
    name: Water hot water low below
    min: 20
    max: 70
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer-outline
  water_hot_ok_temp:
    name: Water hot water OK from
    min: 30
    max: 90
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer
  water_heater_volume:
    name: Water heater volume
    min: 0
    max: 1000
    step: 10
    unit_of_measurement: L
    icon: mdi:water-boiler
  water_tap_frost_temp:
    name: Water outdoor tap frost warning below
    min: -20
    max: 10
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:water-pump-off
  water_irrigation_frost_temp:
    name: Water irrigation frost warning below
    min: -10
    max: 10
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:sprinkler-variant
  water_irrigation_max_minutes:
    name: Water irrigation max run time
    min: 5
    max: 600
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-alert-outline
  water_irrigation_interval_days:
    name: Water irrigation service interval
    min: 30
    max: 730
    step: 1
    unit_of_measurement: d
  water_outdoor_tap_interval_days:
    name: Water outdoor tap check interval
    min: 30
    max: 730
    step: 1
    unit_of_measurement: d
  water_legionella_temp:
    name: Water legionella temperature
    min: 55
    max: 85
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:bacteria-outline
  water_legionella_days:
    name: Water legionella interval
    min: 1
    max: 30
    step: 1
    unit_of_measurement: d
  water_drawdown_min:
    name: Water tank drawdown warning below
    min: 0
    max: 500
    step: 1
    # 0 = off. Set to ~60 % of the normal drawdown once you know it
    unit_of_measurement: L
    icon: mdi:car-coolant-level
  water_precharge_interval_days:
    name: Water pre-charge check interval
    min: 30
    max: 1095
    step: 1
    unit_of_measurement: d
  water_sample_interval_days:
    name: Water sample interval
    min: 90
    max: 3650
    step: 1
    unit_of_measurement: d
  water_uv_interval_days:
    name: Water UV lamp interval
    min: 30
    max: 1095
    step: 1
    unit_of_measurement: d
  water_filter_interval_days:
    name: Water filter change interval
    min: 14
    max: 730
    step: 1
    unit_of_measurement: d

input_boolean:
  water_away:
    name: Water away mode
    icon: mdi:home-export-outline
  water_away_close_valve:
    name: Water close main valve when away
    icon: mdi:valve-closed
  water_auto_heat_cable:
    name: Water automatic heat cable
    icon: mdi:heating-coil
  water_notifications:
    name: Water notifications
    icon: mdi:bell-ring
  water_initialized:
    name: Water package initialized
    icon: mdi:check-circle-outline

input_datetime:
  water_last_precharge_check:
    name: Water last pre-charge check
    has_date: true
    has_time: false
  water_last_water_sample:
    name: Water last water sample
    has_date: true
    has_time: false
  water_last_uv_lamp:
    name: Water last UV lamp change
    has_date: true
    has_time: false
  water_last_filter_change:
    name: Water last filter change
    has_date: true
    has_time: false
  water_last_outdoor_tap:
    name: Water last outdoor tap service
    has_date: true
    has_time: false
  water_last_irrigation_service:
    name: Water last irrigation service
    has_date: true
    has_time: false
  water_irrigation_winterized:
    name: Water irrigation winterized
    has_date: true
    has_time: false

# -------------------------------------------------------------------------------------
# Template entities
# -------------------------------------------------------------------------------------
template:
  # ---- 1. EDIT THIS: your entity IDs (use '' for things you don't have) ----
  - sensor:
      - name: Water system config
        unique_id: water_system_config
        icon: mdi:cog
        state: "ok"
        attributes:
          pressure: "sensor.bod_monitor_pressure"          # bar (kPa/psi not converted here)
          pump_power: "sensor.shelly_pro_em_pump_power"    # W  – or leave '' and use pump_current
          pump_current: ""                                 # A
          valve: "valve.main_water"                        # valve.* or switch.* (on = open). '' if none
          tank_temp: "sensor.bod_monitor_pressure_tank_box"
          outdoor_temp: "sensor.bod_monitor_outside"
          frost_guard: "switch.frostvakt"                  # '' if not controllable/monitored
          heat_trace: "switch.varmekabel"
          leak_sensors: "binary_sensor.leak_tank_box, binary_sensor.leak_water_heater"   # comma separated
          flow: ""                                         # L/min. '' if none
          water_meter: ""                                  # total, litres. '' if none
          water_meter_factor: "1"                          # 1 if meter is in L, 1000 if in m³
          hot_water_temp: "sensor.vvb_temp"
          water_heater: "switch.vvb"                       # switch.* or water_heater.*
          outdoor_tap: ""                                  # valve/switch for the outdoor tap (open = water running). '' if none
          outdoor_tap_shutoff: ""                          # indoor stop valve for the outdoor tap (open/on = water in the outdoor pipe)
          irrigation: ""                                   # irrigation zone switches/valves, comma separated – water use while they run is not an away alarm
          irrigation_shutoff: ""                           # indoor supply valve for the irrigation (open/on = water in the irrigation pipes)

  # ---- pump state, alarms ----
  - binary_sensor:
      - name: Water pump running
        unique_id: water_pump_running
        device_class: running
        icon: mdi:water-pump
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% if c.get('pump_power', '') != '' %}
            {{ states(c.pump_power) | float(0) >= states('input_number.water_pump_power_threshold') | float(50) }}
          {% elif c.get('pump_current', '') != '' %}
            {{ states(c.pump_current) | float(0) >= states('input_number.water_pump_current_threshold') | float(0.5) }}
          {% else %}false{% endif %}

      - name: Water pump tripped
        unique_id: water_pump_tripped
        device_class: problem
        icon: mdi:engine-off
        delay_on:
          seconds: "{{ states('input_number.water_guard_delay') | int(90) }}"
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set p = states(c.get('pressure', '')) | float(-1) %}
          {% set v = c.get('valve', '') %}
          {% set valve_open = v == '' or states(v) in ['open', 'on', 'opening'] %}
          {{ p >= 0 and p < states('input_number.water_cut_in') | float(2) - 0.2
             and is_state('binary_sensor.water_pump_running', 'off') and valve_open }}

      - name: Water pump long run
        unique_id: water_pump_long_run
        device_class: problem
        icon: mdi:timer-alert
        delay_on:
          minutes: "{{ states('input_number.water_max_run_minutes') | int(20) }}"
        state: "{{ is_state('binary_sensor.water_pump_running', 'on') }}"

      - name: Water pump short cycling
        unique_id: water_pump_short_cycling
        device_class: problem
        icon: mdi:sync-alert
        state: >
          {% set r = state_attr('sensor.water_pump_last_cycle', 'recent') or [] %}
          {% set ns = namespace(d=[]) %}
          {% for x in r if x[0] > as_timestamp(now()) - 7200 %}{% set ns.d = ns.d + [x[1]] %}{% endfor %}
          {% set d = (ns.d[-4:]) | sort %}
          {{ d | count >= 3 and d[(d | count) // 2] < states('input_number.water_short_cycle_seconds') | float(30) }}

      - name: Water low pressure
        unique_id: water_low_pressure
        device_class: problem
        icon: mdi:gauge-low
        delay_on:
          seconds: 30
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set p = states(c.get('pressure', '')) | float(-1) %}
          {{ p >= 0 and p < states('input_number.water_cut_in') | float(2) - 0.5 }}

      - name: Water leak
        unique_id: water_leak
        device_class: moisture
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set ids = c.get('leak_sensors', '').split(',') | map('trim') | select('ne', '') | list %}
          {{ ids | select('is_state', 'on') | list | count > 0 }}
        attributes:
          active: >
            {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
            {% set ids = c.get('leak_sensors', '').split(',') | map('trim') | select('ne', '') | list %}
            {{ ids | select('is_state', 'on') | map('state_attr', 'friendly_name') | list | join(', ') }}

      - name: Water frost risk
        unique_id: water_frost_risk
        device_class: cold
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set t = states(c.get('tank_temp', '')) | float(99) %}
          {{ t < states('input_number.water_min_temp') | float(3) }}

      - name: Water frost guard off
        unique_id: water_frost_guard_off
        device_class: problem
        icon: mdi:radiator-off
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set g = c.get('frost_guard', '') %}
          {% set t = states(c.get('tank_temp', '')) | float(99) %}
          {{ g != '' and is_state(g, 'off') and t < states('input_number.water_guard_warn_temp') | float(5)
             and t >= states('input_number.water_min_temp') | float(3) }}

      - name: Water heat cable off
        unique_id: water_heat_cable_off
        device_class: problem
        icon: mdi:snowflake-thermometer
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set h = c.get('heat_trace', '') %}
          {% set t = states(c.get('outdoor_temp', '')) | float(99) %}
          {{ h != '' and is_state(h, 'off') and t < states('input_number.water_trace_warn_temp') | float(5) }}

      - name: Water night activity
        unique_id: water_night_activity
        device_class: problem
        icon: mdi:weather-night
        state: "{{ states('sensor.water_pump_starts_night') | int(0) >= states('input_number.water_night_starts_warn') | int(4) }}"

      - name: Water hot water low
        unique_id: water_hot_water_low
        device_class: problem
        icon: mdi:water-thermometer-outline
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set wh = c.get('water_heater', '') %}
          {% set t = states(c.get('hot_water_temp', '')) | float(99) %}
          {{ t < states('input_number.water_hot_low_temp') | float(50) and (wh == '' or not is_state(wh, 'off')) }}

      - name: Water legionella risk
        unique_id: water_legionella_risk
        device_class: problem
        icon: mdi:bacteria-outline
        state: >
          {% set t = states('sensor.water_heater_last_legionella_heat') %}
          {% if t in ['unknown', 'unavailable', 'none', ''] %}false
          {% else %}{{ (now() - as_datetime(t)).total_seconds() > states('input_number.water_legionella_days') | float(7) * 86400 }}{% endif %}

      - name: Water away alarm
        unique_id: water_away_alarm
        device_class: problem
        icon: mdi:home-alert
        delay_on:
          seconds: 20
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set f = c.get('flow', '') %}
          {% set irr = c.get('irrigation', '').split(',') | map('trim') | select('ne', '') | list %}
          {% set tap = c.get('outdoor_tap', '') %}
          {% set excused = (irr | select('is_state', 'on') | list | count + irr | select('is_state', 'open') | list | count) > 0
                           or (tap != '' and states(tap) in ['on', 'open']) %}
          {{ is_state('input_boolean.water_away', 'on') and not excused and
             (is_state('binary_sensor.water_pump_running', 'on') or (f != '' and states(f) | float(0) > 0.1)) }}

      - name: Water outdoor tap frost
        unique_id: water_outdoor_tap_frost
        device_class: problem
        icon: mdi:water-pump-off
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set tap = c.get('outdoor_tap', '') %}
          {% set sh = c.get('outdoor_tap_shutoff', '') %}
          {% set t = states(c.get('outdoor_temp', '')) | float(99) %}
          {% set live = (tap != '' and states(tap) in ['on', 'open']) or (sh != '' and states(sh) in ['on', 'open']) %}
          {{ (tap != '' or sh != '') and live and t < states('input_number.water_tap_frost_temp') | float(0) }}

      - name: Water irrigation running
        unique_id: water_irrigation_running
        device_class: running
        icon: mdi:sprinkler-variant
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set irr = c.get('irrigation', '').split(',') | map('trim') | select('ne', '') | list %}
          {{ (irr | select('is_state', 'on') | list | count + irr | select('is_state', 'open') | list | count) > 0 }}

      - name: Water irrigation long run
        unique_id: water_irrigation_long_run
        device_class: problem
        icon: mdi:timer-alert-outline
        delay_on:
          minutes: "{{ states('input_number.water_irrigation_max_minutes') | int(60) }}"
        state: "{{ is_state('binary_sensor.water_irrigation_running', 'on') }}"

      - name: Water irrigation frost
        unique_id: water_irrigation_frost
        device_class: problem
        icon: mdi:sprinkler-variant
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set irr = c.get('irrigation', '') %}
          {% set sh = c.get('irrigation_shutoff', '') %}
          {% set t = states(c.get('outdoor_temp', '')) | float(99) %}
          {% set w = states('input_datetime.water_irrigation_winterized') %}
          {% set winterized = w not in ['unknown', 'unavailable', ''] and as_datetime(w) is not none
                              and (now() - as_local(as_datetime(w))).days < 200 %}
          {% set live = (states(sh) in ['on', 'open']) if sh != '' else not winterized %}
          {{ irr != '' and live and t < states('input_number.water_irrigation_frost_temp') | float(3) }}

      - name: Water tank precharge low
        unique_id: water_tank_precharge_low
        device_class: problem
        icon: mdi:gauge-low
        state: >
          {% set lim = states('input_number.water_drawdown_min') | float(0) %}
          {% set d = states('sensor.water_tank_drawdown_avg') | float(-1) %}
          {{ lim > 0 and d >= 0 and d < lim }}

      - name: Water pump wear trend
        unique_id: water_pump_wear_trend
        device_class: problem
        icon: mdi:engine-outline
        state: >
          {% set c7 = states('sensor.water_pump_cycle_avg_7d') | float(0) %}
          {% set c30 = states('sensor.water_pump_cycle_avg_30d') | float(0) %}
          {% set p7 = states('sensor.water_pump_power_avg_7d') | float(0) %}
          {% set p30 = states('sensor.water_pump_power_avg_30d') | float(0) %}
          {{ (c30 > 0 and c7 > c30 * 1.25) or (p30 > 0 and p7 > p30 * 1.15) }}

      - name: Water maintenance due
        unique_id: water_maintenance_due
        device_class: problem
        icon: mdi:wrench-clock
        state: >
          {% set ns = namespace(due=[]) %}
          {% for key, interval, label in [
               ('water_last_precharge_check', 'water_precharge_interval_days', 'Fortrykk i tanken'),
               ('water_last_water_sample', 'water_sample_interval_days', 'Vannprøve'),
               ('water_last_uv_lamp', 'water_uv_interval_days', 'UV-lampe'),
               ('water_last_filter_change', 'water_filter_interval_days', 'Filter'),
                 ('water_last_outdoor_tap', 'water_outdoor_tap_interval_days', 'Utekran'),
                 ('water_last_irrigation_service', 'water_irrigation_interval_days', 'Hagevanning')] %}
            {% set d = states('input_datetime.' ~ key) %}
            {% if d not in ['unknown', 'unavailable', ''] and as_datetime(d) is not none %}
              {% if (now() - as_local(as_datetime(d))).days > states('input_number.' ~ interval) | int(365) %}
                {% set ns.due = ns.due + [label] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.due | count > 0 }}
        attributes:
          items: >
            {% set ns = namespace(due=[]) %}
            {% for key, interval, label in [
                 ('water_last_precharge_check', 'water_precharge_interval_days', 'Fortrykk i tanken'),
                 ('water_last_water_sample', 'water_sample_interval_days', 'Vannprøve'),
                 ('water_last_uv_lamp', 'water_uv_interval_days', 'UV-lampe'),
                 ('water_last_filter_change', 'water_filter_interval_days', 'Filter'),
                 ('water_last_outdoor_tap', 'water_outdoor_tap_interval_days', 'Utekran')] %}
              {% set d = states('input_datetime.' ~ key) %}
              {% if d not in ['unknown', 'unavailable', ''] and as_datetime(d) is not none %}
                {% if (now() - as_local(as_datetime(d))).days > states('input_number.' ~ interval) | int(365) %}
                  {% set ns.due = ns.due + [label] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.due }}

  # ---- last time the hot water reached the legionella temperature ----
  - triggers:
      - trigger: template
        value_template: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {{ states(c.get('hot_water_temp', '')) | float(0) >= states('input_number.water_legionella_temp') | float(70) }}
    sensor:
      - name: Water heater last legionella heat
        unique_id: water_heater_last_legionella_heat
        device_class: timestamp
        icon: mdi:bacteria-outline
        state: "{{ now().isoformat() }}"

  # ---- duration of each pump cycle, with the last few kept for short-cycle detection ----
  - triggers:
      - trigger: state
        entity_id: binary_sensor.water_pump_running
        from: "on"
        to: "off"
    sensor:
      - name: Water pump last cycle
        unique_id: water_pump_last_cycle
        unit_of_measurement: s
        device_class: duration
        state_class: measurement
        icon: mdi:timer-outline
        state: "{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() | round(0) }}"
        attributes:
          recent: >
            {% set d = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() | round(0) | int %}
            {% set prev = this.attributes.get('recent', []) if this is defined else [] %}
            {{ (prev + [[as_timestamp(now()) | int, d]])[-8:] }}

  # ---- pump power/current sampled only while it runs (for the wear trend) ----
  - triggers:
      - trigger: state
        entity_id: binary_sensor.water_pump_running
        to: "on"
        for:
          seconds: 15
    sensor:
      - name: Water pump running load
        unique_id: water_pump_running_load
        state_class: measurement
        icon: mdi:flash
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% if c.get('pump_power', '') != '' %}{{ states(c.pump_power) | float(0) }}
          {% elif c.get('pump_current', '') != '' %}{{ states(c.pump_current) | float(0) }}
          {% else %}0{% endif %}

  # ---- tank drawdown: litres delivered between pump stop and next pump start ----
  - triggers:
      - trigger: state
        entity_id: binary_sensor.water_pump_running
        to: "on"
        id: start
      - trigger: state
        entity_id: binary_sensor.water_pump_running
        to: "off"
        id: stop
    sensor:
      - name: Water tank drawdown
        unique_id: water_tank_drawdown
        unit_of_measurement: L
        state_class: measurement
        icon: mdi:car-coolant-level
        state: >
          {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
          {% set mtr = c.get('water_meter', '') %}
          {% set m = states(mtr) | float(-1) * c.get('water_meter_factor', '1') | float(1) if mtr != '' else -1 %}
          {% set last = this.attributes.get('meter_at_stop', -1) | float(-1) if this is defined else -1 %}
          {% if trigger.id == 'start' and m >= 0 and last >= 0 and m >= last %}{{ (m - last) | round(1) }}
          {% else %}{{ this.state if this is defined and this.state not in ['unknown', 'unavailable'] else 'unknown' }}{% endif %}
        attributes:
          meter_at_stop: >
            {% set c = states.sensor.water_system_config.attributes if states.sensor.water_system_config is not none else {} %}
            {% set mtr = c.get('water_meter', '') %}
            {% if trigger.id == 'stop' and mtr != '' %}{{ states(mtr) | float(-1) * c.get('water_meter_factor', '1') | float(1) }}
            {% else %}{{ this.attributes.get('meter_at_stop', -1) if this is defined else -1 }}{% endif %}

# -------------------------------------------------------------------------------------
# Statistics and history
# -------------------------------------------------------------------------------------
sensor:
  - platform: history_stats
    name: Water pump starts today
    unique_id: water_pump_starts_today
    entity_id: binary_sensor.water_pump_running
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Water pump runtime today
    unique_id: water_pump_runtime_today
    entity_id: binary_sensor.water_pump_running
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Water pump starts night
    unique_id: water_pump_starts_night
    entity_id: binary_sensor.water_pump_running
    state: "on"
    type: count
    start: >
      {% set s = today_at() + timedelta(hours=states('input_number.water_night_start') | int(1)) %}
      {{ s if now() >= s else s - timedelta(days=1) }}
    end: >
      {% set s = today_at() + timedelta(hours=states('input_number.water_night_start') | int(1)) %}
      {% set s = s if now() >= s else s - timedelta(days=1) %}
      {{ s + timedelta(hours=(states('input_number.water_night_end') | int(5)) - (states('input_number.water_night_start') | int(1))) }}

  - platform: statistics
    name: Water pump cycle avg 7d
    unique_id: water_pump_cycle_avg_7d
    entity_id: sensor.water_pump_last_cycle
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 2000
    precision: 0

  - platform: statistics
    name: Water pump cycle avg 30d
    unique_id: water_pump_cycle_avg_30d
    entity_id: sensor.water_pump_last_cycle
    state_characteristic: mean
    max_age:
      days: 30
    sampling_size: 8000
    precision: 0

  - platform: statistics
    name: Water pump power avg 7d
    unique_id: water_pump_power_avg_7d
    entity_id: sensor.water_pump_running_load
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 2000
    precision: 1

  - platform: statistics
    name: Water pump power avg 30d
    unique_id: water_pump_power_avg_30d
    entity_id: sensor.water_pump_running_load
    state_characteristic: mean
    max_age:
      days: 30
    sampling_size: 8000
    precision: 1

  - platform: statistics
    name: Water tank drawdown avg
    unique_id: water_tank_drawdown_avg
    entity_id: sensor.water_tank_drawdown
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 2000
    precision: 1

# -------------------------------------------------------------------------------------
# Notifications – one place to change where messages go
# -------------------------------------------------------------------------------------
script:
  water_notify:
    alias: Water – send notification
    mode: queued
    fields:
      title: {description: Title}
      message: {description: Message}
      tag: {description: Notification tag}
      actions: {description: Action buttons}
      critical: {description: Break through silent mode}
    sequence:
      - condition: state
        entity_id: input_boolean.water_notifications
        state: "on"
      - action: notify.notify            # CHANGE ME → e.g. notify.mobile_app_kjetils_iphone (or a notify group)
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: "{{ tag | default('water') }}"
            actions: "{{ actions | default([]) }}"
            push:
              interruption-level: "{{ 'critical' if critical | default(false) else 'active' }}"
            ttl: 0
            priority: high
            channel: "{{ 'Vann alarm' if critical | default(false) else 'Vann' }}"

  water_close_valve:
    alias: Water – close main valve
    sequence:
      - variables:
          v: "{{ state_attr('sensor.water_system_config', 'valve') }}"
      - condition: template
        value_template: "{{ v not in [none, ''] }}"
      - action: "{{ 'valve.close_valve' if v.startswith('valve.') else 'switch.turn_off' }}"
        target:
          entity_id: "{{ v }}"

  water_open_valve:
    alias: Water – open main valve
    sequence:
      - variables:
          v: "{{ state_attr('sensor.water_system_config', 'valve') }}"
      - condition: template
        value_template: "{{ v not in [none, ''] }}"
      - action: "{{ 'valve.open_valve' if v.startswith('valve.') else 'switch.turn_on' }}"
        target:
          entity_id: "{{ v }}"

automation:
  # ---- first start: set default thresholds once (afterwards your own values are kept) ----
  - id: water_init_defaults
    alias: Water – set default thresholds (first start only)
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.water_initialized
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.water_initialized
        state: "off"
    actions:
      - delay: {seconds: 5}
      - action: input_number.set_value
        target: {entity_id: input_number.water_cut_in}
        data: {value: 2.0}
      - action: input_number.set_value
        target: {entity_id: input_number.water_cut_out}
        data: {value: 3.5}
      - action: input_number.set_value
        target: {entity_id: input_number.water_hot_ok_temp}
        data: {value: 60}
      - action: input_number.set_value
        target: {entity_id: input_number.water_heater_volume}
        data: {value: 200}
      - action: input_number.set_value
        target: {entity_id: input_number.water_tap_frost_temp}
        data: {value: 0}
      - action: input_number.set_value
        target: {entity_id: input_number.water_outdoor_tap_interval_days}
        data: {value: 182}
      - action: input_number.set_value
        target: {entity_id: input_number.water_irrigation_frost_temp}
